<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>학습 기록 이전 · 정보처리기사 필기 대비</title>
  <style>
    :root{color-scheme:light;--ink:#17322a;--green:#247a55;--line:#d7e2dc;--soft:#f4f8f5}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--soft);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:var(--ink)}
    main{width:min(560px,100%);background:white;border:1px solid var(--line);border-radius:22px;padding:32px;box-shadow:0 16px 50px rgba(23,50,42,.08)}
    h1{margin:0 0 12px;font-size:clamp(24px,6vw,34px)}
    p{line-height:1.7;margin:10px 0;color:#496159}
    .summary{margin:22px 0;padding:16px;border-radius:14px;background:#edf6f0;font-weight:700;color:#205b42}
    label{display:block;margin:20px 0 8px;font-weight:700}
    input{width:100%;height:48px;border:1px solid #b9cbc1;border-radius:10px;padding:0 14px;font-size:16px}
    button{width:100%;height:52px;margin-top:18px;border:0;border-radius:12px;background:var(--green);color:white;font-size:17px;font-weight:800;cursor:pointer}
    button:disabled{opacity:.55;cursor:wait}
    small{display:block;margin-top:16px;line-height:1.6;color:#71847b}
    #status{min-height:24px;margin-top:12px;color:#a13b3b;font-weight:700}
  </style>
</head>
<body>
  <main>
    <h1>학습 기록 이전</h1>
    <p>이 브라우저에 저장된 진도, 오답, 북마크, 직접 작성한 해설을 새 사이트로 옮깁니다. 이동 후 유저명과 PIN을 등록하면 데이터베이스 동기화가 완료됩니다.</p>
    <div class="summary" id="summary">저장된 기록을 확인하고 있습니다.</div>
    <label for="username">유저명</label>
    <input id="username" autocomplete="username" placeholder="기존에 사용하던 유저명">
    <button id="migrate" type="button">새 사이트로 이전하기</button>
    <div id="status" role="alert"></div>
    <small>데이터는 주소나 외부 서비스에 노출하지 않고 새 정보처리기사 사이트로 직접 전달됩니다. PIN 원문은 데이터베이스에 저장하지 않으며, 기존 Firebase와 이 브라우저의 원본 기록도 삭제하지 않습니다.</small>
  </main>
  <script>
    const TARGET = 'https://info-exam-flashcards.taeon0111.chatgpt.site/flashcards.html#legacy-migration=';
    const ACTIVE_KEY = 'infoEngineerFlashcardsActiveUser';
    const BASE_KEYS = [
      'infoEngineerFlashcardsProgressV2',
      'infoEngineerFlashcardsExplanationsV1',
      'infoEngineerFlashcardsExplanationsMetaV1',
      'infoEngineerFlashcardsLastPositionV1'
    ];
    const usernameInput = document.getElementById('username');
    const summary = document.getElementById('summary');
    const status = document.getElementById('status');
    const migrateButton = document.getElementById('migrate');

    function collect(){
      const items = {};
      const users = new Set();
      for(let i = 0; i < localStorage.length; i += 1){
        const key = localStorage.key(i);
        if(!key) continue;
        const base = BASE_KEYS.find(candidate => key === candidate || key.startsWith(candidate + '__user_'));
        if(!base) continue;
        const value = localStorage.getItem(key);
        if(value !== null) items[key] = value;
        const marker = '__user_';
        const markerAt = key.indexOf(marker);
        if(markerAt >= 0){
          const user = key.slice(markerAt + marker.length).trim();
          if(user) users.add(user);
        }
      }
      return {items, users};
    }

    const found = collect();
    const activeUser = (localStorage.getItem(ACTIVE_KEY) || '').trim();
    if(activeUser) found.users.add(activeUser);
    usernameInput.value = activeUser || [...found.users][0] || '';
    const recordCount = Object.keys(found.items).length;
    summary.textContent = recordCount
      ? `브라우저 기록 ${recordCount}개 · 유저 ${found.users.size || 1}명 발견`
      : '이 브라우저에서 저장된 학습 기록을 찾지 못했습니다.';

    function bytesToBase64Url(bytes){
      let binary = '';
      const chunkSize = 0x8000;
      for(let i = 0; i < bytes.length; i += chunkSize){
        binary += String.fromCharCode(...bytes.subarray(i, i + chunkSize));
      }
      return btoa(binary).replaceAll('+', '-').replaceAll('/', '_').replace(/=+$/, '');
    }

    async function encodeBundle(bundle){
      const raw = new TextEncoder().encode(JSON.stringify(bundle));
      if(!('CompressionStream' in window)) return 'r.' + bytesToBase64Url(raw);
      const compressed = await new Response(
        new Blob([raw]).stream().pipeThrough(new CompressionStream('gzip'))
      ).arrayBuffer();
      return 'g.' + bytesToBase64Url(new Uint8Array(compressed));
    }

    migrateButton.addEventListener('click', async () => {
      const username = usernameInput.value.trim();
      if(!username){
        status.textContent = '기존에 사용하던 유저명을 입력해 주세요.';
        usernameInput.focus();
        return;
      }
      const latest = collect();
      latest.users.add(username);
      localStorage.setItem(ACTIVE_KEY, username);
      const bundle = {
        version:1,
        activeUser:username,
        users:[...latest.users],
        items:latest.items,
        createdAt:new Date().toISOString()
      };
      migrateButton.disabled = true;
      migrateButton.textContent = '새 사이트로 이동 중…';
      status.textContent = '';
      try{
        const encoded = await encodeBundle(bundle);
        location.href = TARGET + encoded;
      }catch(error){
        migrateButton.disabled = false;
        migrateButton.textContent = '새 사이트로 이전하기';
        status.textContent = '기록을 포장하지 못했습니다. 잠시 후 다시 시도해 주세요.';
      }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>정보처리기사 플래시카드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700;900&family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F3EFE4;
    --paper-line:#D9D2BC;
    --ink:#1C2B3A;
    --ink-soft:#4B5A68;
    --stamp-red:#B7362F;
    --stamp-green:#2C6E49;
    --gold:#9C7A2E;
    --card-bg:#FBF9F3;
    --shadow: rgba(28,43,58,0.18);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      repeating-linear-gradient(180deg, rgba(28,43,58,0.025) 0px, rgba(28,43,58,0.025) 1px, transparent 1px, transparent 34px),
      var(--paper);
    color:var(--ink);
    font-family:'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    min-height:100vh;
    padding:28px 16px 60px;
  }
  .wrap{max-width:720px;margin:0 auto;}

  /* ===== Header : official document title block ===== */
  .doc-header{
    border:2px solid var(--ink);
    border-radius:2px;
    padding:20px 22px 16px;
    background:var(--card-bg);
    position:relative;
    box-shadow:5px 5px 0 var(--shadow);
  }
  .doc-header::before{
    content:"제 24 회 시행";
    position:absolute; top:10px; right:16px;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px; letter-spacing:0.05em;
    color:var(--ink-soft);
  }
  .doc-eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px; letter-spacing:0.22em;
    color:var(--gold); text-transform:uppercase;
    margin-bottom:6px;
  }
  h1{
    font-family:'Noto Serif KR', serif;
    font-weight:900;
    font-size:clamp(24px,5.5vw,32px);
    margin:0 0 4px;
    letter-spacing:-0.01em;
  }
  .doc-sub{
    font-size:13px; color:var(--ink-soft); margin:0;
  }

  /* ===== Subject tabs (like index tabs on an exam booklet) ===== */
  .tabs{
    margin:18px 0 16px;
  }
  .group-switch{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-bottom:10px;
  }
  .group-tab{
    min-height:48px;
    padding:10px 14px;
    border:2px solid var(--ink);
    border-radius:6px 6px 0 0;
    background:#EAE4D5;
    color:var(--ink-soft);
    font-family:'Noto Serif KR',serif;
    font-size:15px;
    font-weight:900;
    cursor:pointer;
    transition:background .12s ease, color .12s ease, transform .12s ease;
  }
  .group-tab:hover{transform:translateY(-2px);}
  .group-tab.active{
    background:var(--ink);
    color:#fff;
    border-bottom-color:var(--stamp-red);
    box-shadow:0 4px 0 var(--stamp-red);
  }
  .tab-panel{
    padding:12px;
    border:1.5px solid var(--ink);
    border-radius:3px;
    background:rgba(255,255,255,.42);
  }
  .tab-list{display:flex; flex-wrap:wrap; gap:6px;}
  .tab{
    font-family:'Noto Sans KR',sans-serif;
    font-size:13px; font-weight:700;
    padding:9px 12px;
    background:var(--card-bg);
    border:1.5px solid var(--ink);
    border-bottom-width:4px;
    border-radius:3px 3px 0 0;
    cursor:pointer;
    color:var(--ink-soft);
    transition:transform .12s ease, color .12s ease, background .12s ease;
    user-select:none;
  }
  .tab .num{font-family:'IBM Plex Mono',monospace; color:var(--gold); margin-right:5px;}
  .tab:hover{transform:translateY(-2px);}
  .tab.active{
    color:var(--ink);
    background:#fff;
    border-bottom-color:var(--stamp-red);
    transform:translateY(-2px);
  }

  /* ===== Status strip ===== */
  .status{
    display:flex; justify-content:space-between; align-items:center;
    font-family:'IBM Plex Mono',monospace;
    font-size:12.5px; color:var(--ink-soft);
    padding:0 2px 10px;
    border-bottom:1px dashed var(--paper-line);
    margin-bottom:18px;
  }
  .status b{color:var(--ink);}
  .score-good{color:var(--stamp-green); font-weight:600;}
  .score-bad{color:var(--stamp-red); font-weight:600;}
  .review-toggle{
    margin:0 0 14px auto;
    display:block;
    padding:8px 12px;
    border:1.5px solid var(--stamp-red);
    border-radius:3px;
    background:var(--card-bg);
    color:var(--stamp-red);
    font-family:'Noto Sans KR',sans-serif;
    font-size:12.5px; font-weight:700;
    cursor:pointer;
  }
  .review-toggle.active{background:var(--stamp-red); color:#fff;}
  .exam-controls{
    display:none;
    grid-template-columns:1fr auto;
    gap:8px;
    margin:0 0 10px;
  }
  .exam-controls.show{display:grid;}
  .exam-select,.shuffle-btn{
    min-height:40px;
    border:1.5px solid var(--ink);
    border-radius:3px;
    background:var(--card-bg);
    color:var(--ink);
    font-family:'Noto Sans KR',sans-serif;
    font-size:13px; font-weight:700;
    padding:8px 11px;
  }
  .shuffle-btn{cursor:pointer;}
  .shuffle-btn.active{background:var(--ink); color:var(--paper);}

  /* ===== Card ===== */
  .card{
    background:var(--card-bg);
    border:2px solid var(--ink);
    border-radius:3px;
    padding:26px 24px 22px;
    position:relative;
    box-shadow:6px 6px 0 var(--shadow);
    overflow:hidden;
  }
  .qno{
    display:inline-block;
    font-family:'IBM Plex Mono',monospace;
    font-weight:600; font-size:13px;
    background:var(--ink); color:var(--paper);
    padding:4px 10px; border-radius:2px;
    margin-bottom:14px;
  }
  .question{
    font-family:'Noto Serif KR', serif;
    font-weight:700;
    font-size:18px; line-height:1.55;
    margin:0 0 20px;
    white-space:pre-wrap;
  }
  .question-image-wrap{
    display:none;
    margin:0 0 18px;
    padding:10px;
    background:#fff;
    border:1.5px solid var(--paper-line);
    border-radius:3px;
    text-align:center;
  }
  .question-image-wrap.show{display:block;}
  .question-image{
    display:block;
    width:100%; height:auto;
    max-height:680px;
    object-fit:contain;
    margin:0 auto;
    cursor:zoom-in;
  }
  .image-hint{margin-top:7px; font-size:11px; color:var(--ink-soft);}
  .image-modal{
    display:none; position:fixed; inset:0; z-index:1000;
    padding:24px;
    background:rgba(15,24,32,.88);
    align-items:center; justify-content:center;
    cursor:zoom-out;
  }
  .image-modal.show{display:flex;}
  .image-modal img{
    max-width:96vw; max-height:94vh;
    object-fit:contain;
    background:#fff;
    box-shadow:0 8px 30px rgba(0,0,0,.35);
  }
  .choices{display:flex; flex-direction:column; gap:10px;}
  .choices.compact{flex-direction:row; gap:8px;}
  .choices.compact .choice{
    flex:1; min-width:0;
    justify-content:center;
    padding:8px 4px;
  }
  .choices.compact .choice > span:last-child{display:none;}
  .choices.compact .mark{width:24px; height:24px;}
  .choice{
    display:flex; align-items:center; gap:12px;
    padding:12px 14px;
    border:1.5px solid var(--paper-line);
    border-radius:3px;
    background:#fff;
    cursor:pointer;
    text-align:left;
    font-size:14.5px; color:var(--ink);
    font-family:'Noto Sans KR',sans-serif;
    transition:border-color .12s ease, background .12s ease;
  }
  .choice > span:last-child{white-space:pre-wrap; line-height:1.55;}
  .choice:hover:not(.locked){border-color:var(--ink);}
  .choice .mark{
    flex:0 0 auto;
    width:26px; height:26px; border-radius:50%;
    border:2px solid var(--ink-soft);
    display:flex; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono',monospace; font-size:12px; font-weight:600;
    color:var(--ink-soft);
    transition:all .12s ease;
  }
  .choice.selected .mark{
    background:var(--ink); border-color:var(--ink); color:#fff;
  }
  .choice.correct{border-color:var(--stamp-green); background:#F1F7F1;}
  .choice.correct .mark{background:var(--stamp-green); border-color:var(--stamp-green); color:#fff;}
  .choice.wrong{border-color:var(--stamp-red); background:#FBF0EF;}
  .choice.wrong .mark{background:var(--stamp-red); border-color:var(--stamp-red); color:#fff;}
  .choice.locked{cursor:default;}

  .actions{margin-top:20px; display:flex; gap:10px;}
  button.primary{
    flex:1;
    font-family:'Noto Sans KR',sans-serif; font-weight:700; font-size:14.5px;
    padding:13px; border-radius:3px; border:2px solid var(--ink);
    background:var(--ink); color:var(--paper);
    cursor:pointer;
    transition:opacity .12s ease;
  }
  button.primary:disabled{opacity:0.35; cursor:not-allowed;}
  button.primary.next{background:var(--stamp-red); border-color:var(--stamp-red); color:#fff;}
  .navigation{display:flex; gap:10px; margin-top:16px;}
  .nav-btn{
    flex:1; padding:11px 12px;
    border:1.5px solid var(--ink);
    border-radius:3px;
    background:var(--card-bg);
    color:var(--ink);
    font-family:'Noto Sans KR',sans-serif;
    font-size:13px; font-weight:700;
    cursor:pointer;
  }
  .nav-btn:hover{background:#fff;}
  .nav-btn:disabled{opacity:.35; cursor:not-allowed;}

  /* ===== Explanation / stamp ===== */
  .result{
    margin-top:20px; padding-top:18px;
    border-top:1px dashed var(--paper-line);
    position:relative;
    display:none;
  }
  .result.show{display:block; animation:fadeUp .22s ease;}
  @keyframes fadeUp{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}
  .stamp{
    position:absolute; top:-6px; right:6px;
    font-family:'Noto Serif KR',serif; font-weight:900;
    font-size:22px; letter-spacing:0.08em;
    border:3px solid var(--stamp-red); color:var(--stamp-red);
    padding:4px 10px; border-radius:6px;
    transform:rotate(-9deg);
    opacity:0.9;
  }
  .stamp.ok{border-color:var(--stamp-green); color:var(--stamp-green); transform:rotate(-7deg);}
  .exp-label{
    font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:0.14em;
    color:var(--gold); margin-bottom:6px;
  }
  .exp-text{font-size:14.5px; line-height:1.65; color:var(--ink); padding-right:70px;}
  .official-explanation{
    display:none;
    margin-top:14px;
    padding:14px 16px;
    border-left:4px solid var(--gold);
    background:#FFF9EA;
  }
  .official-explanation.show{display:block;}
  .official-explanation-text{font-size:14.5px; line-height:1.75; color:var(--ink); white-space:pre-wrap;}
  .official-explanation-image{
    display:none;
    width:100%; height:auto;
    margin-top:8px;
    background:#fff;
    border:1px solid var(--paper-line);
    cursor:zoom-in;
  }
  .official-explanation-image.show{display:block;}
  .explanation-editor{
    margin-top:16px;
    padding-top:14px;
    border-top:1px dashed var(--paper-line);
  }
  .editor-label{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
    margin-bottom:7px;
    font-size:13px;
    font-weight:800;
    color:var(--ink);
  }
  .editor-label small{font-size:11px; font-weight:500; color:var(--ink-soft);}
  .explanation-input{
    width:100%;
    min-height:110px;
    resize:vertical;
    box-sizing:border-box;
    padding:11px 12px;
    border:1.5px solid var(--ink);
    border-radius:4px;
    background:#FFFDF7;
    color:var(--ink);
    font-family:'Noto Sans KR',sans-serif;
    font-size:14px;
    line-height:1.6;
  }
  .explanation-input:focus{outline:3px solid rgba(181,138,46,.2); border-color:var(--gold);}
  .editor-actions{display:flex; align-items:center; gap:7px; margin-top:8px;}
  .editor-btn{
    padding:7px 11px;
    border:1.5px solid var(--ink);
    border-radius:3px;
    background:var(--card-bg);
    color:var(--ink);
    font-family:'Noto Sans KR',sans-serif;
    font-size:12px;
    font-weight:700;
    cursor:pointer;
  }
  .editor-btn.save{background:var(--ink); color:#fff;}
  .editor-status{margin-left:auto; font-size:11.5px; color:var(--stamp-green);}

  .footer-note{
    text-align:center; font-size:11.5px; color:var(--ink-soft);
    margin-top:22px; font-family:'IBM Plex Mono',monospace;
  }

  @media (max-width:480px){
    .card{padding:20px 16px 18px;}
    .exp-text{padding-right:0;}
    .stamp{position:static; display:inline-block; margin-bottom:10px;}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="doc-header">
    <div class="doc-eyebrow">정보처리기사 · 필기 대비</div>
    <h1>플래시 암기카드</h1>
    <p class="doc-sub">과목을 선택하고, 문제를 풀고, 제출 즉시 해설을 확인하세요.</p>
  </div>

  <div class="tabs" id="tabs"></div>

  <div class="status">
    <span>과목 <b id="subjectLabel">-</b></span>
    <span>문항 <b id="progressLabel">0/0</b></span>
    <span><span class="score-good" id="correctCount">0</span> 정답 · <span class="score-bad" id="wrongCount">0</span> 오답</span>
  </div>
  <div class="exam-controls" id="examControls">
    <select class="exam-select" id="examSetSelect" aria-label="연도와 회차 선택"></select>
    <button class="shuffle-btn" id="shuffleBtn">랜덤 출제</button>
  </div>
  <button class="review-toggle" id="reviewToggle">틀린 문제만 보기 (0)</button>

  <div class="card">
    <div class="qno" id="qno">문 01</div>
    <div class="question-image-wrap" id="questionImageWrap">
      <img class="question-image" id="questionImage" alt="기출문제 원본 이미지">
      <div class="image-hint">이미지를 누르면 크게 볼 수 있습니다.</div>
    </div>
    <p class="question" id="questionText">문제를 불러오는 중...</p>
    <div class="choices" id="choices"></div>

    <div class="actions">
      <button class="primary" id="submitBtn" disabled>제출하기</button>
      <button class="primary next" id="nextBtn" style="display:none;">다음 문제 →</button>
    </div>

    <div class="result" id="result">
      <div class="stamp" id="stamp">오답</div>
      <div class="exp-label">정답</div>
      <div class="exp-text" id="expText"></div>
      <div class="official-explanation" id="officialExplanation">
        <div class="exp-label">해설</div>
        <div class="official-explanation-text" id="officialExplanationText"></div>
        <img class="official-explanation-image" id="officialExplanationImage" alt="문제 해설 원본 이미지">
      </div>
      <div class="explanation-editor">
        <label class="editor-label" for="explanationInput">
          <span>해설 직접 편집</span>
          <small>이 브라우저에 문항별로 저장됩니다.</small>
        </label>
        <textarea class="explanation-input" id="explanationInput" placeholder="이 문제를 이해하는 데 필요한 해설이나 암기 내용을 입력하세요."></textarea>
        <div class="editor-actions">
          <button class="editor-btn save" id="saveExplanationBtn" type="button">해설 저장</button>
          <button class="editor-btn" id="deleteExplanationBtn" type="button">내용 삭제</button>
          <span class="editor-status" id="explanationStatus" aria-live="polite"></span>
        </div>
      </div>
    </div>
  </div>

  <div class="navigation">
    <button class="nav-btn" id="prevBtn">← 이전 문제</button>
    <button class="nav-btn" id="navNextBtn">다음 문제 →</button>
  </div>

  <div class="footer-note">과목별 기출 · 빈출문제</div>
</div>

<div class="image-modal" id="imageModal" aria-hidden="true">
  <img id="modalImage" alt="확대된 기출문제 원본 이미지">
</div>

<script src="정보처리기사_플래시카드_문항데이터.js"></script>
<script src="정보처리기사_플래시카드_필수코드.js"></script>
<script>
const DATA = {
  "소프트웨어 설계": [
    {"q":"소프트웨어 공학의 기본 원칙이라고 볼 수 없는 것은?","c":["품질 높은 소프트웨어 상품 개발","지속적인 검증 시행","결과에 대한 명확한 기록 유지","최대한 많은 인력 투입"],"a":3},
    {"q":"다음 중 CASE의 장점이 아닌 것은?","c":["자동화된 기법을 통해 소프트웨어 품질이 향상된다.","소프트웨어의 유지보수를 간편하게 수행할 수 있다.","소프트웨어의 생산성이 향상된다.","소프트웨어 모듈의 재사용성이 줄어든다."],"a":3},
    {"q":"객체에게 어떤 행위를 하도록 지시하는 명령은?","c":["Class","Package","Object","Message"],"a":3},
    {"q":"분산 시스템에서의 미들웨어(Middleware)와 관련한 설명으로 틀린 것은?","c":["분산 시스템에서 다양한 부분을 관리하고 통신하며 데이터를 교환하게 해주는 소프트웨어로 볼 수 있다.","위치 투명성(Location Transparency)을 제공한다.","분산 시스템의 여러 컴포넌트가 요구하는 재사용 가능한 서비 스의 구현을 제공한다.","애플리케이션과 사용자 사이에서만 분산 서비스를 제공한다."],"a":3},
    {"q":"기본 유스케이스 수행 시 특별한 조건을 만족할 때 수행하는 유스케이 스는?","c":["연관","확장","선택","특화"],"a":1},
    {"q":"다음 중 소프트웨어 요구사항 분석을 위해 대상이 되는 목표 집단에 속한 사용자 유형의 대표가 되는 가상 인물에 대한 표현으로 옳은 것은?","c":["페르소나","진첩도","번업 차트","스토리 맵"],"a":0},
    {"q":"파이프 필터 형태의 소프트웨어 아키텍처에 대한 설명으로 옳은 것은?","c":["노드와 간선으로 구성된다.","서브시스템이 입력 데이터를 받아 처리하고 결과를 다음 서브 시스템으로 넘겨주는 과정을 반복한다.","계층 모델이라고도 한다.","3개의 서브시스템(모델, 뷰, 제어)으로 구성되어 있다."],"a":1},
    {"q":"분산 시스템을 위한 마스터-슬레이브(Master-Slave) 아키텍처에 대한 설명으로 틀린 것은?","c":["일반적으로 실시간 시스템에서 사용된다.","마스터 프로세스는 일반적으로 연산, 통신, 조정을 책임진다.","슬레이브 프로세스는 데이터 수집 기능을 수행할 수 없다.","마스터 프로세스는 슬레이브 프로세스들을 제어할 수 있다."],"a":2},

    {"q":"DoS(Denial of Service) 공격과 관련한 내용으로 틀린 것은?","c":["Ping of Death 공격은 정상 크기보다 큰 ICMP 패킷을 작은 조각(Fragment)으로 쪼개어 공격 대상이 조각화된 패킷을 처 리하게 만드는 공격 방법이다.","Smurf 공격은 멀티캐스트(Multicast)를 활용하여 공격 대상이 네트워크의 임의의 시스템에 패킷을 보내게 만드는 공격이다.","SYN Flooding은 존재하지 않는 클라이언트가 서버별로 한정 된 접속 가능 공간에 접속한 것처럼 속여 다른 사용자가 서비 스를 이용하지 못하게 하는 것이다.","Land 공격은 패킷 전송 시 출발지 IP 주소와 목적지 IP 주소 값을 똑같이 만들어서 공격 대상에게 보내는 공격 방법이다."],"a":1},

    {"q":"다음에서 설명하는 IT 기술은? · 네트워크를 제어부, 데이터 전달부로 분리하여 네트워크 관리자가 보다 효율적으로 네트워크를 제어, 관리할 수 있는 기술 · 기존의 라우터, 스위치 등과 같이 하드웨어에 의존하는 네트워크 체계에서 안정성, 속도, 보안 등을 소프트웨어 로 제어, 관리하기 위해 개발됨 · 네트워크 장비의 펌웨어 업그레이드를 통해 사용자의 직 접적인 데이터 전송 경로 관리가 가능하고, 기존 네트워 크에는 영향을 주지 않으면서 특정 서비스의 전송 경로 수정을 통하여 인터넷상에서 발생하는 문제를 처리할 수 있음","c":["SDN(Software Defined Networking)","NFS(Network File System)","Network Mapper","AOE Network"],"a":0},
    {"q":"소프트웨어 개발 방법론의 테일러링(Tailoring)과 관련한 설명으로 틀린 것은?","c":["프로젝트 수행 시 예상되는 변화를 배제하고 신속히 진행하여 야 한다.","프로젝트에 최적화된 개발 방법론을 적용하기 위해 절차, 산출 물 등을 적절히 변경하는 활동이다.","관리 측면에서의 목적 중 하나는 최단기간에 안정적인 프로젝 트 진행을 위한 사전 위험을 식별하고 제거하는 것이다.","기술적 측면에서의 목적 중 하나는 프로젝트에 최적화된 기술 요소를 도입하여 프로젝트 특성에 맞는 최적의 기법과 도구를 사용하는 것이다."],"a":0},
    {"q":"침입 탐지 시스템(IDS; Intrusion Detection System)과 관련한 설명으 로 틀린 것은?","c":["이상 탐지 기법(Anomaly Detection)은 Signature Base나 Knowledge Base라고도 불리며 이미 발견되고 정립된 공격 패턴을 입력해두었다가 탐지 및 차단한다.","HIDS(Host-Based Intrusion Detection)는 운영체제에 설정 된 사용자 계정에 따라 어떤 사용자가 어떤 접근을 시도하고 어떤 작업을 했는지에 대한 기록을 남기고 추적한다.","NIDS(Network-Based Intrusion Detection System)로는 대 표적으로 Snort가 있다.","외부 인터넷에 서비스를 제공하는 서버가 위치하는 네트워크 인 DMZ(Demilitarized Zone)에는 IDS가 설치될 수 있다."],"a":0},

}

function isExamSubject(){
  return Object.prototype.hasOwnProperty.call(EXAM_IMAGE_OFFSETS, currentSubject);
}

function getExamIndices(){
  if(!isExamSubject()){
    return DATA[currentSubject].map((_, index) => index);
  }
  const examSet = getExamSet();
  return Array.from({length:examSet.countPerSubject}, (_, index) => examSet.start + index)
    .filter(index => index < DATA[currentSubject].length);
}

function renderTabs(){
  tabsEl.innerHTML = "";
  const activeGroup = Object.entries(SUBJECT_GROUPS)
    .find(([, groupSubjects]) => groupSubjects.includes(currentSubject))?.[0]
    || Object.keys(SUBJECT_GROUPS)[0];

  const groupSwitch = document.createElement('div');
  groupSwitch.className = 'group-switch';
  Object.keys(SUBJECT_GROUPS).forEach(groupName => {
    const groupTab = document.createElement('button');
    groupTab.type = 'button';
    groupTab.className = 'group-tab' + (groupName === activeGroup ? ' active' : '');
    groupTab.textContent = groupName;
    groupTab.onclick = () => {
      if(groupName === activeGroup) return;
      currentSubject = SUBJECT_GROUPS[groupName][0];
      currentIndex = 0;
      wrongOnly = false;
      renderTabs();
      renderCard();
    };
    groupSwitch.appendChild(groupTab);
  });
  tabsEl.appendChild(groupSwitch);

  const panel = document.createElement('section');
  panel.className = 'tab-panel';
  const list = document.createElement('div');
  list.className = 'tab-list';
  SUBJECT_GROUPS[activeGroup].forEach((subject, index) => {
    const tab = document.createElement('div');
    tab.className = 'tab' + (subject === currentSubject ? ' active' : '');
    tab.innerHTML = `<span class="num">${String(index+1).padStart(2,'0')}</span>${subject}`;
    tab.onclick = () => {
      currentSubject = subject;
      const visible = getVisibleIndices();
      currentIndex = visible.length ? visible[0] : 0;
      renderTabs();
      renderCard();
    };
    list.appendChild(tab);
  });
  panel.appendChild(list);
  tabsEl.appendChild(panel);
}

function renderStatus(){
  const total = getExamIndices().length;
  const visible = getVisibleIndices();
  const visiblePosition = visible.indexOf(currentIndex);
  subjectLabel.textContent = currentSubject;
  progressLabel.textContent = wrongOnly
    ? (visible.length ? `${visiblePosition+1}/${visible.length} (전체 ${total})` : `0/0 (전체 ${total})`)
    : (total ? `${visiblePosition+1}/${total}` : '0/0');
  correctCountEl.textContent = scores[currentSubject].correct;
  wrongCountEl.textContent = scores[currentSubject].wrong;
  reviewToggle.textContent = wrongOnly
    ? `전체 문제 보기 (오답 ${scores[currentSubject].wrongItems.size})`
    : `틀린 문제만 보기 (${scores[currentSubject].wrongItems.size})`;
  reviewToggle.classList.toggle('active', wrongOnly);
  examControls.classList.toggle('show', isExamSubject());
  shuffleBtn.textContent = randomMode ? '순서대로 보기' : '랜덤 출제';
  shuffleBtn.classList.toggle('active', randomMode);
}

function getVisibleIndices(){
  let indices = getExamIndices();
  if(wrongOnly){
    const wrong = scores[currentSubject].wrongItems;
    indices = indices.filter(i => wrong.has(i));
  }
  if(randomMode && isExamSubject()){
    const key = `${selectedExamSetId}:${currentSubject}:${wrongOnly ? 'wrong' : 'all'}`;
    if(!randomOrders[key] || randomOrders[key].length !== indices.length || randomOrders[key].some(i => !indices.includes(i))){
      randomOrders[key] = shuffleIndices(indices);
    }
    return randomOrders[key];
  }
  return indices;
}

function shuffleIndices(indices){
  const shuffled = [...indices];
  for(let i=shuffled.length-1; i>0; i--){
    const j = Math.floor(Math.random()*(i+1));
    [shuffled[i],shuffled[j]] = [shuffled[j],shuffled[i]];
  }
  return shuffled;
}

function renderCard(){
  selected = null;
  answered = false;
  const visible = getVisibleIndices();
  const item = wrongOnly && !visible.includes(currentIndex)
    ? null
    : DATA[currentSubject][currentIndex];
  if(!item){
    qnoEl.textContent = '준비 중';
    questionText.textContent = wrongOnly
      ? '현재 다시 풀 오답이 없습니다.'
      : `${currentSubject} 문제를 추가해 주세요.`;
    questionText.style.display = 'block';
    questionImageWrap.classList.remove('show');
    questionImage.removeAttribute('src');
    choicesEl.innerHTML = '';
    choicesEl.classList.remove('compact');
    submitBtn.disabled = true;
    submitBtn.style.display = 'block';
    nextBtn.style.display = 'none';
    resultEl.classList.remove('show');
    prevBtn.disabled = true;
    navNextBtn.disabled = true;
    renderStatus();
    return;
  }
  const examSet = getExamSet();
  const localIndex = isExamSubject() ? currentIndex - examSet.start : currentIndex;
  qnoEl.textContent = `문 ${String(localIndex+1).padStart(2,'0')}`;
  const imageOffset = EXAM_IMAGE_OFFSETS[currentSubject];
  const imageNumber = imageOffset === undefined ? null : imageOffset + localIndex + 1;
  const imagePath = item.image || (imageNumber
    ? `${examSet.imageDir}/q${String(imageNumber).padStart(3,'0')}.webp`
    : null);
  if(imagePath){
    questionImage.src = imagePath;
    questionImage.alt = `${currentSubject} ${localIndex+1}번 문제 원본`;
    questionImageWrap.classList.add('show');
    questionText.style.display = 'none';
  }else{
    questionImageWrap.classList.remove('show');
    questionImage.removeAttribute('src');
    questionText.style.display = 'block';
  }
  questionText.textContent = item.q;
  choicesEl.innerHTML = "";
  const imageChoiceMode = isExamSubject() || Boolean(item.image);
  choicesEl.classList.toggle('compact', imageChoiceMode);
  item.c.forEach((choiceText, idx) => {
    const div = document.createElement('div');
    div.className = 'choice';
    const visibleChoiceText = imageChoiceMode ? '' : choiceText;
    const mark = document.createElement('span');
    mark.className = 'mark';
    mark.textContent = CHOICE_LABELS[idx];
    const label = document.createElement('span');
    label.textContent = visibleChoiceText;
    div.append(mark, label);
    div.onclick = () => selectChoice(idx);
    choicesEl.appendChild(div);
  });
  submitBtn.disabled = true;
  submitBtn.style.display = 'block';
  nextBtn.style.display = 'none';
  resultEl.classList.remove('show');
  const canNavigate = getVisibleIndices().length > 1;
  prevBtn.disabled = !canNavigate;
  navNextBtn.disabled = !canNavigate;
  renderStatus();
}

function selectChoice(idx){
  if(answered) return;
  selected = idx;
  [...choicesEl.children].forEach((el, i) => {
    el.classList.toggle('selected', i === idx);
  });
  submitBtn.disabled = false;
}

function getExplanationKey(){
  return `${currentSubject}:${currentIndex}`;
}

function loadExplanation(){
  explanationInput.value = savedExplanations[getExplanationKey()] || '';
  explanationStatus.textContent = explanationInput.value ? '저장된 해설' : '';
}

function saveExplanation(){
  const key = getExplanationKey();
  const text = explanationInput.value.trim();
  if(text){
    savedExplanations[key] = text;
    explanationInput.value = text;
    explanationStatus.textContent = '저장되었습니다.';
  }else{
    delete savedExplanations[key];
    explanationStatus.textContent = '빈 내용은 저장하지 않았습니다.';
  }
  localStorage.setItem(EXPLANATION_STORAGE_KEY, JSON.stringify(savedExplanations));
}

function deleteExplanation(){
  delete savedExplanations[getExplanationKey()];
  localStorage.setItem(EXPLANATION_STORAGE_KEY, JSON.stringify(savedExplanations));
  explanationInput.value = '';
  explanationStatus.textContent = '삭제되었습니다.';
}

function submitAnswer(){
  if(selected === null || answered) return;
  answered = true;
  const item = DATA[currentSubject][currentIndex];
  const acceptedAnswers = Array.isArray(item.a) ? item.a : [item.a];
  const isCorrect = acceptedAnswers.includes(selected);

  [...choicesEl.children].forEach((el, i) => {
    el.classList.add('locked');
    if(acceptedAnswers.includes(i)) el.classList.add('correct');
    else if(i === selected) el.classList.add('wrong');
  });

  const subjectScore = scores[currentSubject];
  if(!subjectScore.done.has(currentIndex)){
    subjectScore.done.add(currentIndex);
    if(isCorrect){
      subjectScore.correct++;
    }else{
      subjectScore.wrong++;
      subjectScore.wrongItems.add(currentIndex);
    }
  }else if(isCorrect && subjectScore.wrongItems.has(currentIndex)){
    subjectScore.wrongItems.delete(currentIndex);
    subjectScore.wrong--;
    subjectScore.correct++;
  }else if(!isCorrect && !subjectScore.wrongItems.has(currentIndex)){
    subjectScore.wrongItems.add(currentIndex);
    subjectScore.correct--;
    subjectScore.wrong++;
  }
  saveProgress();
  renderStatus();

  stampEl.textContent = isCorrect ? '정답' : '오답';
  stampEl.className = 'stamp' + (isCorrect ? ' ok' : '');
  const answerText = acceptedAnswers
    .map(index => `${CHOICE_LABELS[index]} ${item.c[index] || ''}`.trim())
    .join(' 또는 ');
  expText.textContent = answerText;
  officialExplanationText.textContent = item.e || '';
  officialExplanationText.style.display = item.explanationImage ? 'none' : 'block';
  if(item.explanationImage){
    officialExplanationImage.src = item.explanationImage;
    officialExplanationImage.classList.add('show');
  }else{
    officialExplanationImage.removeAttribute('src');
    officialExplanationImage.classList.remove('show');
  }
  officialExplanation.classList.toggle('show', Boolean(item.e || item.explanationImage));
  loadExplanation();
  resultEl.classList.add('show');

  submitBtn.style.display = 'none';
  nextBtn.style.display = 'block';
}

function nextCard(){
  moveCard(1);
}

function moveCard(direction){
  const visible = getVisibleIndices();
  if(!visible.length){
    renderCard();
    return;
  }
  let position = visible.indexOf(currentIndex);
  if(position < 0) position = direction > 0 ? -1 : 0;
  position = (position + direction + visible.length) % visible.length;
  currentIndex = visible[position];
  renderCard();
}

function toggleWrongOnly(){
  wrongOnly = !wrongOnly;
  const visible = getVisibleIndices();
  currentIndex = visible.length ? visible[0] : 0;
  renderCard();
}

function selectExamSet(){
  selectedExamSetId = examSetSelect.value;
  randomOrders = {};
  const visible = getVisibleIndices();
  currentIndex = visible.length ? visible[0] : 0;
  renderCard();
}

function shuffleExam(){
  randomMode = !randomMode;
  if(randomMode){
    const key = `${selectedExamSetId}:${currentSubject}:${wrongOnly ? 'wrong' : 'all'}`;
    randomOrders[key] = shuffleIndices(getExamIndices().filter(i => !wrongOnly || scores[currentSubject].wrongItems.has(i)));
  }
  const visible = getVisibleIndices();
  currentIndex = visible.length ? visible[0] : 0;
  renderCard();
}

submitBtn.addEventListener('click', submitAnswer);
nextBtn.addEventListener('click', nextCard);
prevBtn.addEventListener('click', () => moveCard(-1));
navNextBtn.addEventListener('click', () => moveCard(1));
reviewToggle.addEventListener('click', toggleWrongOnly);
examSetSelect.addEventListener('change', selectExamSet);
shuffleBtn.addEventListener('click', shuffleExam);
saveExplanationBtn.addEventListener('click', saveExplanation);
deleteExplanationBtn.addEventListener('click', deleteExplanation);
questionImage.addEventListener('click', () => {
  if(!questionImage.src) return;
  modalImage.src = questionImage.src;
  imageModal.classList.add('show');
  imageModal.setAttribute('aria-hidden', 'false');
});
officialExplanationImage.addEventListener('click', () => {
  if(!officialExplanationImage.src) return;
  modalImage.src = officialExplanationImage.src;
  imageModal.classList.add('show');
  imageModal.setAttribute('aria-hidden', 'false');
});
imageModal.addEventListener('click', () => {
  imageModal.classList.remove('show');
  imageModal.setAttribute('aria-hidden', 'true');
  modalImage.removeAttribute('src');
});
document.addEventListener('keydown', event => {
  if(event.key === 'Escape' && imageModal.classList.contains('show')) imageModal.click();
});

renderTabs();
renderCard();
</script>
</body>
</html>
